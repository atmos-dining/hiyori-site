name: Publish Hiyori website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate blog posts
        run: python3 scripts/validate_posts.py
      - name: Build pages and sitemap
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Public launch on the confirmed custom domain.
          SITE_INDEXABLE: 'true'
        run: |
          python3 scripts/build.py
          python3 scripts/package_site.py
      - name: Upload public website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
